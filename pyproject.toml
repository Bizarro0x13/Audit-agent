[project]
name = "audit-agent-reference"
version = "0.1.0"
description = "Public reference implementation of a multi-agent code-audit architecture (simplified on purpose)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic",
    "typer",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.scripts]
agent = "agent.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
